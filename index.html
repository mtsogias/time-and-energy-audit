<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Time &amp; Energy Audit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="no-stamp">
  <header class="topbar">
    <div class="topbar-row">
      <div class="tabs">
        <button id="tab-log" class="tab active">Log</button>
        <button id="tab-analyse" class="tab">Analyse</button>
      </div>
      <div id="range-toggle" class="seg hidden">
        <button data-range="day" class="active">Tag</button>
        <button data-range="week">Woche</button>
        <button data-range="custom">Zeitraum</button>
      </div>
      <div class="topbar-actions">
        <button id="undo-btn" class="undo-btn hidden" aria-label="Rueckgaengig">&#8630;</button>
        <button id="settings-btn" class="settings-btn" aria-label="Einstellungen">&#9881;</button>
      </div>
    </div>
    <div class="topbar-row">
      <div class="daynav">
        <button id="prev-day" class="navbtn" aria-label="Tag zurueck">&#8249;</button>
        <button id="day-label" class="daylabel">Heute</button>
        <button id="next-day" class="navbtn" aria-label="Tag vor">&#8250;</button>
      </div>
      <button id="now-btn" class="nowbtn"><span class="nowdot"></span><span id="now-text">Jetzt</span></button>
    </div>
  </header>

  <main id="log-view">
    <div id="timeline"></div>
  </main>

  <main id="analyse-view" class="hidden">
    <div id="analysis"></div>
  </main>

  <div id="act-backdrop" class="act-backdrop hidden"></div>
  <div id="stampbar" class="hidden">
    <div class="act-picker" id="act-picker">
      <button type="button" id="act-trigger" class="act-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="act-menu">
        <span id="act-trigger-label"></span>
        <svg class="act-chevron" width="16" height="16" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" id="act-add" class="act-add">+</button>
      <div id="act-menu" class="act-menu hidden" role="listbox"></div>
    </div>
    <div id="new-activity-row" class="hidden">
      <input id="new-activity-input" type="text" placeholder="Neue Aktivitaet..." maxlength="30" autocomplete="off">
      <button id="add-activity-btn">OK</button>
    </div>
    <div class="stamp-row">
      <div id="value-select" class="seg gold">
        <button data-v="1">$</button>
        <button data-v="2" class="active">$$</button>
        <button data-v="3">$$$</button>
        <button data-v="0">&ndash;</button>
      </div>
      <div id="energy-select" class="seg">
        <button data-e="1" class="e-green active"><span class="dot green"></span></button>
        <button data-e="0" class="e-neutral"><span class="dot neutral"></span></button>
        <button data-e="-1" class="e-red"><span class="dot red"></span></button>
      </div>
    </div>
    <div class="stamp-row dur-row">
      <button id="dur-minus" class="dur-btn" aria-label="Kuerzer">&minus;</button>
      <span id="dur-text" class="dur-text">Block antippen</span>
      <button id="dur-plus" class="dur-btn" aria-label="Laenger">+</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <div id="print-report" hidden></div>

  <!-- Modal fuer Chip-Verwaltung (Umbenennen / Loeschen) und Notiz -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-card">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <div id="modal-actions"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
